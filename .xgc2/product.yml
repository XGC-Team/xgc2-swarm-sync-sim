schema: xgc2.product.v1
id: xgc2-swarm-sync-sim
name: XGC2 Swarm Sync Sim
version: 1.1.0-16
kind: ros1-apt
summary: Multi-vehicle synchronized simulation packages for ROS Noetic.
ros:
  distro: noetic
  packages:
  - sss_sim_env
  - px4_rotor_sim
  - tello_sim
  - ugv_sim
  - fw_plane_sim
apt:
  distribution: focal
  install:
  - ros-noetic-swarm-sync-sim
  packages:
  - ros-noetic-swarm-sync-sim
  - ros-noetic-sss-sim-env
  - ros-noetic-sss-px4-rotor-sim
  - ros-noetic-sss-tello-sim
  - ros-noetic-sss-ugv-sim
  - ros-noetic-sss-fw-plane-sim
  package_architectures:
    ros-noetic-sss-fw-plane-sim:
    - amd64
  depends:
  - libxgc2-xrpc1 (>= 0.1.0)
  - libboost-json-dev (>= 1.75)
  - ros-noetic-sss-sim-env (>= 1.1.0-8)
  - ros-noetic-sss-px4-rotor-sim (>= 1.1.0-8)
  - ros-noetic-sss-tello-sim (>= 1.1.0-8)
  - ros-noetic-sss-ugv-sim (>= 1.1.0-8)
  - ros-noetic-sss-fw-plane-sim (>= 1.1.0-8)
usage:
  notes: Clock process workflow requires an explicit control_socket. GUI consumes the formal XRPC wheel with an explicitly selected Python >=3.10 and matching PyQt/ROS modules. Stock Focal system Python is not replaced; controlled ABI/runtime acceptance remains open.
  install: 'sudo apt update

    sudo apt install ros-noetic-swarm-sync-sim

    '
  smoke_test: 'roslaunch --files sss_sim_env sim_clock.launch

    '
ownership:
  paths:
  - /opt/ros/noetic/share/sss_sim_env
  - /opt/ros/noetic/share/px4_rotor_sim
  - /opt/ros/noetic/share/tello_sim
  - /opt/ros/noetic/share/ugv_sim
  - /opt/ros/noetic/share/fw_plane_sim
  - /opt/ros/noetic/lib/sss_sim_env
  - /opt/ros/noetic/lib/px4_rotor_sim
  - /opt/ros/noetic/lib/tello_sim
  - /opt/ros/noetic/lib/ugv_sim
  - /opt/ros/noetic/lib/fw_plane_sim
release:
  requires:
  - xgc2-xrpc
  dependency_policy:
    xgc2-xrpc: rebuild
  skip_apt_verify: true
  apt_versions:
    focal: 1.1.0-16
